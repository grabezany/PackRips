<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pack Rips</title>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg:#0b0c10;
    --p:#14161d;
    --ln:#23262f;
    --tx:#eceef4;
    --mu:#7f8597;
    color-scheme:dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px)
  }

  html {
    scroll-padding-top:env(safe-area-inset-top,0px)
  }

  * {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent
  }

  html,body {
    height:100%;
    margin:0
  }

  body {
    background:var(--bg);
    color:var(--tx);
    font:500 15px system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none
  }

  header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 18px;
    height:52px;
    flex:none
  }

  .logo {
    font-weight:800;
    letter-spacing:.3em;
    font-size:13px
  }

  .cash {
    font-weight:700;
    font-variant-numeric:tabular-nums;
    color:#4ade80
  }

  main {
    flex:1;
    position:relative;
    min-height:0
  }

  .screen {
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    overflow-y:auto;
    overflow-x:hidden;
    padding:8px 16px 20px
  }

  .screen.on {
    display:flex;
    animation:in .3s
  }

  @keyframes in {
    from {
    opacity:0
  }


  }

  h1,h2 {
    font-weight:700;
    margin:4px 0;
    text-align:center;
    letter-spacing:-.01em
  }

  h1 {
    font-size:32px;
    line-height:1.15
  }

  h2 {
    font-size:22px
  }

  .sub {
    color:var(--mu);
    margin:2px 0 10px;
    text-align:center
  }

  .btn {
    border:0;
    border-radius:12px;
    padding:14px 26px;
    font:600 15px system-ui,sans-serif;
    cursor:pointer;
    min-width:220px
  }

  .btn:active {
    transform:scale(.98)
  }

  .btn:disabled {
    opacity:.35
  }

  .pri {
    background:var(--tx);
    color:#0b0c10
  }

  .sec {
    background:none;
    color:var(--tx);
    border:1px solid var(--ln)
  }

  .lnk {
    background:none;
    border:0;
    color:var(--mu);
    font:600 14px system-ui;
    padding:8px;
    cursor:pointer
  }

  .col {
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
    margin-top:16px
  }

  nav {
    display:flex;
    flex:none;
    border-top:1px solid var(--ln)
  }

  nav.hide {
    display:none
  }

  nav button {
    flex:1;
    background:none;
    border:0;
    color:var(--mu);
    padding:10px 0 12px;
    font:600 11px system-ui;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px
  }

  nav button.on {
    color:var(--tx)
  }

  nav svg {
    width:22px;
    height:22px
  }

  .ico {
    display:grid;
    place-items:center;
    line-height:1
  }

  .ico svg {
    width:1em;
    height:1em
  }

  .ico img {
    width:1em;
    height:1em;
    object-fit:contain
  }

  /* Pack cover */

.pack {
    position:relative;
    width:15em;
    height:22em;
    border-radius:.8em;
    background:linear-gradient(170deg,var(--c1),var(--c2));
    color:#fff;
    text-align:center;
    overflow:hidden
  }

  .band {
    position:absolute;
    inset:0 0 auto;
    height:14%;
    background:var(--c2);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 1.4em;
    font-size:.6em;
    font-weight:700;
    letter-spacing:.25em
  }

  .band span {
    opacity:.8
  }

  .pb {
    position:absolute;
    inset:14% 0 9%;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:.5em
  }

  .rays {
    position:absolute;
    left:50%;
    top:36%;
    width:22em;
    height:22em;
    margin:-11em 0 0 -11em;
    background:radial-gradient(circle,rgba(255,255,255,.2),transparent 62%)
  }

  .ring {
    position:relative;
    width:5.6em;
    height:5.6em;
    border-radius:50%;
    border:.14em solid rgba(255,255,255,.9);
    background:rgba(0,0,0,.28);
    outline:.12em dotted rgba(255,255,255,.55);
    outline-offset:.35em;
    display:grid;
    place-items:center
  }

  .ring .ico {
    font-size:3em
  }

  .pn {
    position:relative;
    font-weight:800;
    font-size:1.5em;
    letter-spacing:.2em;
    text-transform:uppercase;
    padding-left:.2em;
    margin-top:.4em
  }

  .tag {
    position:relative;
    font-size:.65em;
    letter-spacing:.25em;
    opacity:.85;
    font-weight:600
  }

  .dots {
    position:relative;
    display:flex;
    gap:.4em
  }

  .dots i {
    width:.55em;
    height:.55em;
    border-radius:50%
  }

  .price {
    position:relative;
    margin-top:.3em;
    border:.1em solid rgba(255,255,255,.6);
    border-radius:99px;
    padding:.2em .9em;
    font-size:.85em;
    font-weight:700
  }

  .foot {
    position:absolute;
    inset:auto 0 0;
    height:9%;
    background:var(--c2);
    display:grid;
    place-items:center;
    font-size:.58em;
    font-weight:700;
    letter-spacing:.25em;
    border-radius:0 0 1.4em 1.4em
  }


  /* Basketball pack artwork */
  .pack {
    background:radial-gradient(ellipse at 50% 42%, color-mix(in srgb,var(--c1) 88%,white), transparent 55%),
      linear-gradient(155deg,var(--c1),var(--c2) 78%);
    border:1px solid rgba(255,255,255,.32);
    box-shadow:inset 0 0 30px rgba(0,0,0,.24),0 12px 28px rgba(0,0,0,.28)
  }
  .band,.foot {background:rgba(8,12,20,.34);backdrop-filter:blur(5px)}
  .band {font-size:.48em;letter-spacing:.16em;padding:0 1em}
  .court-mark {position:absolute;inset:14% 7% 9%;border:1px solid rgba(255,255,255,.13);border-top:0;border-bottom:0;pointer-events:none}
  .court-mark:before {content:"";position:absolute;left:50%;top:50%;width:7em;height:7em;border:1px solid rgba(255,255,255,.13);border-radius:50%;transform:translate(-50%,-50%)}
  .court-mark:after {content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.13)}
  .ring {background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(0,0,0,.28));border-color:rgba(255,255,255,.82);box-shadow:0 0 28px rgba(255,255,255,.16)}
  .basketball {width:4em;height:4em;fill:#e77b32;stroke:#54270f;stroke-width:3.2;stroke-linecap:round}
  .pn {font-size:1.05em;line-height:1.25;letter-spacing:.055em;padding:0 .45em;text-shadow:0 2px 8px rgba(0,0,0,.45)}
  .tag {letter-spacing:.2em}
  .price {background:rgba(8,12,20,.25);backdrop-filter:blur(4px)}

  .edge {
    position:absolute;
    top:14%;
    bottom:9%;
    width:.3em;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.4) 0 .3em,transparent .3em .6em)
  }

  .edge.l {
    left:.5em
  }

  .edge.r {
    right:.5em
  }

  .car {
    position:relative;
    display:flex;
    gap:1.6em;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    width:100%;
    padding:1.2em calc(50% - 7.5em);
    font-size:14px;
    scrollbar-width:none;
    flex:none
  }

  .car::-webkit-scrollbar {
    display:none
  }

  .pk {
    flex:0 0 15em;
    scroll-snap-align:center;
    scroll-snap-stop:always;
    transform:scale(.85);
    opacity:.3;
    transition:transform .25s,opacity .25s;
    cursor:pointer;
    backface-visibility:hidden
  }

  .pk.act {
    transform:none;
    opacity:1
  }

  .chips {
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
    margin:6px 0 14px
  }

  .chip {
    padding:3px 9px;
    border-radius:99px;
    font-size:12px;
    font-weight:600;
    border:1px solid
  }

  /* Pack opening / tear interaction */

.ostage {
    flex:1;
    display:grid;
    place-items:center;
    position:relative;
    width:100%;
    font-size:min(20px,4.8vw,3vh)
  }

  .rp {
    position:relative;
    width:15em;
    height:22em;
    touch-action:none;
    cursor:grab
  }

  .rp .pack {
    overflow:visible
  }

  .strip {
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:16%;
    background:var(--c2);
    border-radius:.8em .8em 0 0;
    z-index:2;
    pointer-events:none;
    clip-path:polygon(0 0,0 0,0 0)
  }

  .strip.off {
    animation:fly .7s ease-in forwards
  }

  @keyframes fly {
    to {
    transform:translate(120%,-300%) rotate(80deg);
    opacity:0
  }


  }

  .dash {
    position:absolute;
    right:0;
    top:14%;
    border-top:2px dashed rgba(255,255,255,.6);
    z-index:3;
    pointer-events:none
  }

  .tp {
    position:absolute;
    top:14%;
    width:1.1em;
    height:1.1em;
    margin:-.55em 0 0 -.55em;
    border-radius:50%;
    background:#fff;
    z-index:4;
    pointer-events:none;
    animation:pl 1.3s infinite
  }

  @keyframes pl {
    50% {
    opacity:.35
  }


  }

  .rp.pop {
    animation:pop 1s .4s forwards
  }

  @keyframes pop {
    40% {
    transform:scale(1.08)
  }

  to {
    transform:scale(1.4);
    opacity:0
  }


  }

  .burst {
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    opacity:0;
    pointer-events:none;
    z-index:5
  }

  .burst.go {
    animation:bst 1.1s .4s ease-out forwards
  }

  @keyframes bst {
    0% {
    opacity:.8;
    box-shadow:0 0 30px 10px var(--bc)
  }

  100% {
    opacity:0;
    box-shadow:0 0 90px 120vmax var(--bc)
  }


  }

  /* Trading cards */

.rstage {
    position:relative;
    flex:1;
    width:100%;
    font-size:min(21px,5.3vw,3.1vh);
    cursor:pointer;
    min-height:300px
  }

  .cw {
    position:absolute;
    left:50%;
    top:50%;
    margin:-10.5em 0 0 -7.5em;
    width:15em;
    height:21em;
    perspective:1200px;
    transition:transform .5s cubic-bezier(.3,.8,.3,1),opacity .5s
  }

  .card {
    position:relative;
    width:15em;
    height:21em;
    transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.2,.8,.2,1)
  }

  .card.f {
    transform:rotateY(180deg)
  }

  .face,.back {
    position:absolute;
    inset:0;
    border-radius:.9em;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden
  }

  .back {
    background:#12141b;
    border:.12em solid var(--ln);
    display:grid;
    place-items:center;
    font-size:2em;
    font-weight:800;
    letter-spacing:.2em;
    color:var(--ln)
  }

  .face {
    transform:rotateY(180deg);
    border:.15em solid var(--rc);
    background:#12141b;
    display:flex;
    flex-direction:column;
    padding:.9em;
    box-shadow:0 0 calc(var(--g)*1em) color-mix(in srgb,var(--rc) 55%,transparent)
  }

  .top {
    display:flex;
    justify-content:space-between;
    align-items:baseline
  }

  .top b {
    font-size:1.9em;
    line-height:1;
    font-weight:800
  }

  .top span {
    font-size:.7em;
    font-weight:700;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--rc)
  }

  .art {
    flex:1;
    margin:.6em 0;
    border-radius:.6em;
    overflow:hidden;
    display:grid;
    place-items:center;
    background:#0d0f14;
    color:var(--rc)
  }

  .art .ico {
    font-size:5em;
    width:100%;
    height:100%
  }

  .art .ico img {
    width:100%;
    height:100%;
    object-fit:cover
  }

  .nm {
    font-weight:700;
    font-size:1.15em;
    text-align:center
  }

  .tm {
    font-size:.7em;
    color:var(--mu);
    text-align:center;
    letter-spacing:.15em;
    text-transform:uppercase;
    margin-top:.3em
  }

  #hint {
    text-align:center;
    min-height:44px;
    color:var(--mu);
    font-weight:600
  }

  #cnt {
    color:var(--mu);
    font-weight:600;
    letter-spacing:.1em;
    text-align:center;
    padding-top:8px
  }

  #flash {
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0;
    z-index:50
  }

  #flash.go {
    animation:fl .7s
  }

  #flash.big {
    animation-duration:1.2s
  }

  @keyframes fl {
    0% {
    opacity:.6
  }

  100% {
    opacity:0
  }


  }

  .pt {
    position:fixed;
    width:6px;
    height:6px;
    border-radius:50%;
    pointer-events:none;
    z-index:60;
    animation:pt .9s ease-out forwards
  }

  @keyframes pt {
    to {
    transform:translate(var(--dx),var(--dy)) scale(.2);
    opacity:0
  }


  }

  body.shake main {
    animation:shk .5s
  }

  @keyframes shk {
    20% {
    transform:translate(-8px,4px)
  }

  40% {
    transform:translate(7px,-5px)
  }

  60% {
    transform:translate(-5px,-3px)
  }

  80% {
    transform:translate(4px,4px)
  }


  }

  .grid {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:2.5vw;
    width:100%;
    max-width:760px;
    margin:10px 0
  }

  .grid .card,.lk {
    font-size:min(9px,calc((100vw - 32px - 5vw)/45))
  }

  .cwrap {
    position:relative;
    cursor:pointer
  }

  .lk {
    width:15em;
    height:21em;
    border-radius:.9em;
    border:.12em dashed var(--ln);
    display:grid;
    place-items:center;
    color:var(--ln)
  }

  .lk svg {
    width:4em;
    height:4em
  }

  .cnt {
    position:absolute;
    top:-6px;
    right:-6px;
    background:var(--tx);
    color:#0b0c10;
    font:700 11px system-ui;
    border-radius:99px;
    padding:2px 7px;
    z-index:2
  }

  .seg {
    display:flex;
    border:1px solid var(--ln);
    border-radius:10px;
    overflow:hidden;
    margin:6px 0 8px
  }

  .seg button {
    background:none;
    border:0;
    color:var(--mu);
    padding:8px 24px;
    font:600 14px system-ui;
    cursor:pointer
  }

  .seg .on {
    background:var(--p);
    color:var(--tx)
  }

  .slab {
    width:17.4em;
    padding:.6em;
    border-radius:1em;
    background:linear-gradient(160deg,#2a2e3b,#161922);
    border:.12em solid #4a5066
  }

  .sl-l {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:.6em;
    background:#eceef4;
    color:#0b0c10;
    border-radius:.5em;
    padding:.5em .7em;
    margin-bottom:.6em;
    font-size:.85em
  }

  .sl-l b {
    display:block
  }

  .sl-l small {
    display:block;
    font-size:.7em;
    color:#555;
    font-weight:600;
    letter-spacing:.05em
  }

  .sl-g {
    text-align:center;
    border-left:.3em solid;
    padding-left:.7em;
    min-width:4.4em
  }

  .sl-g b {
    font-size:2em;
    line-height:1
  }

  .sl-c {
    display:grid;
    place-items:center;
    background:#0b0c10;
    border-radius:.5em;
    padding:.5em;
    box-shadow:inset 0 0 1em #000
  }

  .grid .slab {
    font-size:min(8.2px,calc((100vw - 32px - 5vw)/52))
  }

  .grid .slab .card,.sc .slab .card {
    font-size:inherit
  }

  .sc .slab {
    font-size:13px
  }

  /* Bottom sheet / modal */

#sheet {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:40
  }

  #sheet.on {
    display:flex
  }

  .sc {
    background:var(--p);
    border-top:1px solid var(--ln);
    border-radius:18px 18px 0 0;
    width:min(520px,100%);
    max-height:88%;
    overflow-y:auto;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
    animation:up .25s
  }

  @keyframes up {
    from {
    transform:translateY(40px);
    opacity:0
  }


  }

  .sc .card {
    font-size:13px
  }

  .cardbox {
    display:grid;
    place-items:center;
    margin-bottom:12px
  }

  .gh {
    display:flex;
    justify-content:space-between;
    font-size:12px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    margin:16px 0 2px
  }

  .row {
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--ln)
  }

  .row .ico {
    font-size:20px
  }

  .row small {
    display:block;
    color:var(--mu);
    font-size:12px
  }

  .row b {
    font-variant-numeric:tabular-nums
  }
</style>
</head>
<body>

  <header><b class="logo">PACK RIPS</b><span class="cash" id="cash"></span>
  </header>
  <main>
<section id="home" class="screen" style="justify-content:center">
 <h1>Open packs.<br>Chase the rare ones.</h1><p class="sub" id="stats"></p>
 <div class="col"><button class="btn pri" id="go">Open Packs</button><button class="btn sec" id="daily"></button></div>
</section>
<section id="select" class="screen">
 <h2>Choose a pack</h2><p class="sub">Swipe to browse, tap to select</p>
 <div class="car" id="car"></div>
 <div id="pinfo" style="text-align:center"></div>
 <button class="btn pri" id="pick"></button><button class="lnk" id="pool">View drop pool</button>
</section>
<section id="open" class="screen" style="padding-top:4px">
 <p class="sub" id="otxt"></p>
 <div class="ostage"><div class="rp" id="rp"></div><i class="burst" id="burst"></i></div>
 <button class="lnk" id="cancel">Cancel</button>
</section>
<section id="reveal" class="screen" style="padding:0 16px 12px">
 <div id="cnt"></div><div class="rstage" id="stage"></div><div id="hint"></div>
</section>
<section id="sum" class="screen">
 <h2>Pack opened</h2><p class="sub" id="best"></p>
 <div class="grid" id="sgrid"></div>
 <div class="col" style="margin-top:4px"><button class="btn pri" id="again">Open another</button></div>
</section>
<section id="col" class="screen">
 <h2>Collection</h2><p class="sub" id="ccount"></p>
 <button class="btn sec" id="sellall" style="min-width:0;padding:10px 16px"></button>
 <p class="sub" style="font-size:12px;margin-top:10px">Tap a card to sell it</p><div class="grid" id="cgrid"></div>
</section>
<section id="grade" class="screen">
 <h2>Grading</h2><p class="sub">Slab a card. The grade is a gamble.</p>
 <div class="seg"><button data-g="raw">Cards</button><button data-g="slabs">Slabs</button></div>
 <p class="sub" id="gsub"></p><button class="lnk" id="godds" style="margin-top:-6px">View grade odds</button>
 <div class="grid" id="ggrid"></div>
</section>

  </main>
  <nav id="nav">
 <button data-s="home"><i data-lucide="house"></i>Home</button>
 <button data-s="select"><i data-lucide="package"></i>Packs</button>
 <button data-s="col"><i data-lucide="layers"></i>Cards</button>
 <button data-s="grade"><i data-lucide="award"></i>Grade</button>

  </nav>
  <div id="sheet"><div class="sc" id="sbody"></div>
  </div>
  <div id="flash"></div>
  <script>
/* ===== GAME CONFIG: edit cards, images, values, packs and odds here =====
   All money is in dollars. card.icon is a Lucide icon name; card.image (URL or data URI) replaces it when set.
   card.value: what the card sells for. pack.cost: price to open. pack.odds: weight per rarity (same order as rarities).
   grading.cost: fee to grade one card; each grade has a weight (chance) and a value multiplier. */
const GAME={
 startCash:1,dailyBonus:.5,
 rarities:[

function doGrade(id){const c=CARDS[id];if(!S.col[id]||S.cash<G.cost)return;
 let t=0;GR.forEach(g=>t+=g.weight);let x=Math.random()*t,g=GR[GR.length-1];for(const q of GR){if((x-=q.weight)<=0){g=q;break}}

 setTimeout(()=>{clearInterval(tm);const e=$('#cb');if(!e)return;e.innerHTML='';e.append(slabEl(s));ic();
  const v=slabVal(s),o=c.value,col=gcol(s.grade);

  $('#gs').innerHTML=`${fmt(o)} → <b style="color:${v>=o?'#4ade80':'#ff5a5a'}">${fmt(v)}</b> (×${g.mult})`;
  $('#gb').innerHTML=`<button class="btn pri" data-a="sslab" data-id="${s.uid}">Sell slab · ${fmt(v)}</button><button class="btn sec" data-x>Keep slab</button>`;

function openOdds(){const t=GR.reduce((a,g)=>a+g.weight,0),ev=GR.reduce((a,g)=>a+g.weight*g.mult,0)/t;

function act(a,id){
 if(a=='odds')return openOdds();
 if(a=='gp')return openGradePrompt(CARDS[+id]);

 if(a=='sslab'){const i=S.slabs.findIndex(s=>s.uid==id);if(i<0)return;const v=slabVal(S.slabs[i]);S.slabs.splice(i,1);S.cash=r2(S.cash+v);save();cashUI();gradeUI();return closeSheet()}
 const c=CARDS[+id],n=S.col[id]||0,k=a=='s1'?1:n-1;if(k<=0)return;
 S.col[id]-=k;if(S.col[id]<=0)delete S.col[id];S.cash=r2(S.cash+k*c.value);save();cashUI();colUI();openCard(c)}

const rp=$('#rp');let body,strip,dash,tp,prog=0,drag=false,done=false;

function goOpen(){P=PACKS[cur];if(S.cash<P.cost)return;done=false;prog=0;drag=false;
 rp.className='rp';rp.style.cssText=`--c1:${P.colors[0]};--c2:${P.colors[1]}`;
 rp.innerHTML=`<div class="pack" id="pbody">${packInner(P)}</div><div class="strip" id="strip"></div><i class="dash" id="dash"></i><i class="tp" id="tp"></i>`;
 body=$('#pbody');strip=$('#strip');dash=$('#dash');tp=$('#tp');$('#burst').className='burst';
 $('#otxt').textContent='Drag across the top to rip it open';$('#cancel').style.display='';setP(0);show('open');ic()}

function setP(p){prog=p;const n=Math.max(1,Math.round(p*24)),z=[];
 for(let i=0;i<=n;i++)z.push([p*100*i/n,14+(i%2?1.2:-1.2)]);
 const pc=z.map(a=>a[0].toFixed(1)+'% '+a[1].toFixed(1)+'%').join(',');
 body.style.clipPath=p<=0?'none':`polygon(${pc},${p*100}% 0,100% 0,100% 100%,0 100%)`;
 strip.style.clipPath=p<=0?'polygon(0 0,0 0,0 0)':`polygon(0 0,${p*100}% 0,${z.slice().reverse().map(a=>a[0].toFixed(1)+'% '+(a[1]/16*100).toFixed(1)+'%').join(',')})`;
 strip.style.transformOrigin=`${p*100}% 100%`;strip.style.transform=`rotate(${p*30}deg) translateY(${-p*.5}em)`;
 dash.style.left=p*100+'%';tp.style.left=p*100+'%'}
rp.onpointerdown=e=>{if(done)return;const r=rp.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 if(y>.45||Math.abs(x-prog)>.3)return;drag=true;rp.setPointerCapture(e.pointerId)};
rp.onpointermove=e=>{if(!drag||done)return;const r=rp.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
 const np=Math.max(prog,Math.min(x,prog+.4,1));if(np!==prog){setP(np);if(Math.random()<.2)vib(6)}if(prog>=.96)rip()};
rp.onpointerup=rp.onpointercancel=()=>{drag=false};
$('#cancel').onclick=()=>show('select');

function pick(w,min=0){let t=0;w.forEach((x,i)=>{if(i>=min)t+=x});let r=Math.random()*t;for(let i=min;i<w.length;i++)if(w[i]>0&&(r-=w[i])<=0)return i;return min}

function roll(p){const rs=[];for(let i=0;i<p.count;i++)rs.push(pick(p.odds));rs.sort((a,b)=>a-b);
 return rs.map(r=>{const L=CARDS.filter(c=>c.rarity==r);return L[Math.random()*L.length|0]})}

function rip(){done=true;drag=false;setP(1);tp.style.display=dash.style.display='none';strip.classList.add('off');$('#otxt').textContent='';$('#cancel').style.display='none';
 S.cash=r2(S.cash-P.cost);save();cashUI();pull=roll(P);
 const b=$('#burst');b.style.setProperty('--bc',R[pull[pull.length-1].rarity].color);b.className='burst go';rp.classList.add('pop');vib([30,40,60]);setTimeout(startReveal,1500)}


/* ===== CARD REVEAL ===== */
const st=$('#stage');

function startReveal(){show('reveal');st.innerHTML='';pull.forEach((c,i)=>{const w=document.createElement('div');w.className='cw';w.style.zIndex=100-i;w.append(cardEl(c));st.append(w)});idx=0;upd();ic()}

function upd(){[...st.children].forEach((w,i)=>{const d=i-idx;w.style.transform=d<0?'translateY(-130%) rotate(14deg)':`translateY(${d*14}px) scale(${1-d*.05})`;w.style.opacity=d<0?0:d<3?1:0});
 $('#cnt').textContent=`${Math.min(idx+1,pull.length)} / ${pull.length}`;$('#hint').textContent=idx<pull.length?'Tap the card to reveal':''}
st.onclick=()=>{const w=st.children[idx];if(!w)return;const c=pull[idx],card=w.firstChild;
 if(!card.classList.contains('f')){card.classList.add('f');const nw=!S.col[c.id];S.col[c.id]=(S.col[c.id]||0)+1;save();
  $('#hint').innerHTML=(nw?'<b style="color:#4ade80">New card</b>':'<b style="color:var(--tx)">Duplicate</b>')+` · worth ${fmt(c.value)}<br><small>${idx==pull.length-1?'Tap to finish':'Tap for next'}</small>`;
  setTimeout(()=>fx(c),400)}
 else{idx++;upd();if(idx>=pull.length)setTimeout(summary,300)}};

function fx(c,cc){const col=cc||R[c.rarity].color,f=$('#flash'),x=innerWidth/2,y=innerHeight*.45,n=[4,10,20,36,60][c.rarity];
 f.style.background=`radial-gradient(circle at 50% 45%,${col},transparent 70%)`;f.className='';void f.offsetWidth;f.className='go'+(c.rarity>2?' big':'');
 for(let i=0;i<n;i++){const p=document.createElement('i'),a=Math.random()*6.28,d=80+Math.random()*(120+c.rarity*40);p.className='pt';p.style.cssText=`left:${x}px;top:${y}px;background:${col};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;document.body.append(p);setTimeout(()=>p.remove(),1000)}
 if(c.rarity>2){document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),500)}vib(10+c.rarity*25)}


/* ===== SUMMARY AND COLLECTION ===== */

function summary(){const g=$('#sgrid');g.innerHTML='';pull.forEach(c=>g.append(cardEl(c,1)));const b=pull[pull.length-1];
 $('#best').innerHTML=`Best pull: <b style="color:${R[b.rarity].color}">${b.name}</b> · pack worth ${fmt(pull.reduce((a,c)=>a+c.value,0))}`;show('sum');ic()}
$('#again').onclick=()=>show('select');

function colUI(){const g=$('#cgrid');g.innerHTML='';let o=0,tv=0,dv=0;
 CARDS.slice().sort((a,b)=>b.rarity-a.rarity||a.id-b.id).forEach(c=>{const w=document.createElement('div'),n=S.col[c.id];w.className='cwrap';
  if(n){o++;tv+=n*c.value;dv+=(n-1)*c.value;w.append(cardEl(c,1));if(n>1)w.insertAdjacentHTML('beforeend',`<b class="cnt">×${n}</b>`);w.onclick=()=>openCard(c)}else w.innerHTML='<div class="lk"><i data-lucide="lock"></i></div>';g.append(w)});
 $('#ccount').textContent=`${o} / ${CARDS.length} collected · worth ${fmt(tv)}`;
 const sa=$('#sellall');sa.style.display=dv>0?'':'none';sa.textContent=`Sell all duplicates · ${fmt(dv)}`;ic()}
$('#sellall').onclick=()=>{let t=0;CARDS.forEach(c=>{const n=S.col[c.id]||0;if(n>1){t+=(n-1)*c.value;S.col[c.id]=1}});if(t){S.cash=r2(S.cash+t);save();cashUI();colUI()}};
dUI();show('home');ic();
  </script>
</body>
</html>
